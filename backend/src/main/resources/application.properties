spring.application.name=cardsort-api
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/cardsortlab;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.h2.console.enabled=false
spring.web.resources.static-locations=file:../dist/,classpath:/static/

app.jwt.secret=${JWT_SECRET:cardsort-lab-local-development-secret-change-in-production-2026}
app.jwt.expiration-hours=24
app.cookie.secure=${COOKIE_SECURE:false}
app.frontend.url=${FRONTEND_URL:http://127.0.0.1:5173}
app.demo-user.enabled=${DEMO_USER_ENABLED:true}
